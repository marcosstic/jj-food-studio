# Despliega el sitio a Cloudflare Pages en cada push a main y cuando
# Sanity dispara el webhook de contenido (repository_dispatch tipo "sanity").
# El prebuild (fetch-content.mjs) trae el contenido publicado del dataset
# público de Sanity, así que no se necesitan secretos del CMS.
name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy a Cloudflare Pages
        run: npx wrangler@latest pages deploy build --project-name jjfoodstudio --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
